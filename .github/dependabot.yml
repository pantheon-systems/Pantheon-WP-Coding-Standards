# This file is managed by github-terraform. Manual changes will be overwritten.
# To modify it, edit orgs/pantheon-systems/files/dependabot/custom/Pantheon-WP-Coding-Standards.yml
# in https://github.com/pantheon-systems/github-terraform
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      timezone: America/Los_Angeles
      day: sunday
    target-branch: main
    open-pull-requests-limit: 99
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch
