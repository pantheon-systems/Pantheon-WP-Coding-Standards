name: Test Pantheon Coding Standard Sniffs

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Install dependencies
        run: composer install
      - name: Run tests
        run: composer test